services:
  - type: web
    name: spill-force
    runtime: node
    repo: https://github.com/bechtoldG91/spill-force
    branch: main
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: spill-force-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: json://storage
      - key: STORAGE_DIR
        value: storage
      - key: PUBLIC_DIR
        value: public
      - key: LOG_DIR
        value: storage/.runtime
      - key: PASSWORD_HASH_ROUNDS
        value: 12
      - key: JWT_TTL_SECONDS
        value: 604800
      - key: GLOBAL_ADMIN_EMAILS
        value: gbechtold91@gmail.com
      - key: MAX_UPLOAD_MB
        value: 1024
      - key: JWT_SECRET
        generateValue: true
