services:
  - type: web
    name: spill-force
    runtime: node
    repo: https://github.com/bechtoldG91/spill-force
    branch: main
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: json://storage
      - key: STORAGE_DIR
        value: storage
      - key: PUBLIC_DIR
        value: public
      - key: LOG_DIR
        value: storage/.runtime
      - key: PASSWORD_HASH_ROUNDS
        value: 12
      - key: JWT_TTL_SECONDS
        value: 604800
      - key: GLOBAL_ADMIN_EMAILS
        value: gbechtold91@gmail.com
      - key: MAX_UPLOAD_MB
        value: 100
      - key: JWT_SECRET
        generateValue: true
      - key: GLOBAL_ADMIN_SETUP_TOKEN
        generateValue: true
      - key: SEED_TEST_ACCOUNTS
        value: "true"
      - key: TEST_ADMIN_PASSWORD
        generateValue: true
      - key: TEST_COACH_PASSWORD
        generateValue: true
      - key: TEST_ATHLETE_PASSWORD
        generateValue: true
